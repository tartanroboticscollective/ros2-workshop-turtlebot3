# apriltag_ros built from source: on Linux the robostack-jazzy binary depends on
# camera_ros -> libcamera, which needs gstreamer 1.28, while Qt 5 (rviz, rqt,
# Gazebo) is still pinned to gstreamer 1.26 on conda-forge.
[package]
name = "ros-jazzy-apriltag-ros"
version = "3.4.0"

[package.build]
backend = { name = "pixi-build-rattler-build", version = "*" }
