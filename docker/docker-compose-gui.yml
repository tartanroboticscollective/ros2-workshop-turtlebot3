version: "3.9"
services:
  ros2_jazzy_turblebot3:
    extends:
      file: docker-compose.yml
      service: ros2_jazzy_turblebot3
    environment:
     - DISPLAY=${DISPLAY}
     - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /tmp/.docker.xauth:/tmp/.docker.xauth:rw

